# Hiperparâmetros do DQN, no mesmo formato do dqn.yml da atividade de Atari.
# Diferenças em relação ao Atari e o porquê:
#   policy MlpPolicy      o estado é um vetor de 86 números, não uma imagem
#   sem AtariWrapper      o histórico já está no estado (atenção acumulada)
#   n_timesteps 200k      um episódio tem só 47 decisões (~4.250 textos)
#   learning_starts 5k    100k seria metade do treino
#   exploration_fraction  explorar mais para descobrir o prêmio da agulha
KVCache-v0:
  policy: 'MlpPolicy'
  n_timesteps: !!float 2e5
  buffer_size: 100000
  learning_rate: !!float 1e-4
  batch_size: 64
  learning_starts: 5000
  gamma: 0.99
  target_update_interval: 1000
  train_freq: 4
  gradient_steps: 1
  exploration_fraction: 0.3
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05
  policy_kwargs:
    net_arch: [128, 128]
  env_kwargs:
    orcamento: 16
    bonus_agulha: 10.0
